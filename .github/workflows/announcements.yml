# Reusable workflow -- see /announcements/README.md for consumer documentation.
name: Announcements

on:
  workflow_call:
    inputs:
      announcement:
        description: JSON object with title, text, url, and optional per-channel overrides
        required: true
        type: string
      channels:
        description: JSON array selecting linkedin, bluesky, mastodon, slack, groupsio, or reddit
        required: true
        type: string
      targets:
        description: JSON object mapping channels to arrays of destination IDs
        required: true
        type: string
      mode:
        description: dry-run (no requests), draft (native drafts or previews), or publish
        default: dry-run
        type: string
      environment:
        description: Caller environment for approval rules and environment secrets
        default: announcements
        type: string
      groupsio_host:
        description: Groups.io API host (lists.cncf.io or groups.io)
        default: lists.cncf.io
        type: string
      reddit_user_agent:
        description: Descriptive Reddit API user agent including the bot username
        default: ""
        type: string
      report_name:
        description: Unique artifact label when calling this workflow more than once in a run
        default: announcements
        type: string
    secrets:
      BUFFER_API_KEY:
        required: false
      SLACK_WEBHOOK_URL:
        required: false
      GROUPSIO_API_KEY:
        required: false
      REDDIT_CLIENT_ID:
        required: false
      REDDIT_CLIENT_SECRET:
        required: false
      REDDIT_REFRESH_TOKEN:
        required: false

permissions: {}

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ inputs.environment }}
    steps:
      - name: Deliver announcement
        uses: $/.github/scripts/announcements
        with:
          announcement: ${{ inputs.announcement }}
          channels: ${{ inputs.channels }}
          targets: ${{ inputs.targets }}
          mode: ${{ inputs.mode }}
          groupsio-host: ${{ inputs.groupsio_host }}
          reddit-user-agent: ${{ inputs.reddit_user_agent }}
          report-directory: ${{ runner.temp }}/announcements
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GROUPSIO_API_KEY: ${{ secrets.GROUPSIO_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_REFRESH_TOKEN: ${{ secrets.REDDIT_REFRESH_TOKEN }}

      - name: Upload delivery report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.report_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/announcements/report.json
          if-no-files-found: error
          retention-days: 14
